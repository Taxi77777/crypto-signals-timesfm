services:
  crypto-signals:
    build: .
    container_name: crypto-signals
    restart: unless-stopped

    # Les secrets viennent d'un fichier .env NON versionné (voir .env.example).
    # Ne jamais écrire les clés MEXC en clair dans ce fichier : il finit sur git.
    env_file:
      - .env

    environment:
      USE_TIMESFM: "true"
      # NE PAS passer à 15m : run_once.py calcule le volume 24h avec tail(288),
      # ce qui suppose des bougies 5m. La stratégie télécharge de toute façon
      # ses propres bougies 15m/30m indépendamment de ce réglage.
      DATA_INTERVAL: "5m"
      SIGNAL_FREQUENCY_HOURS: "1"
      LOG_LEVEL: "INFO"
      CANDLE_CLOSE_OFFSET_SEC: "20"
      TZ: "Europe/Paris"

    volumes:
      # Logs et état persistants : survivent à un redémarrage du conteneur.
      - ./logs:/app/logs
      - ./state:/app/state
      # Cache des poids de modèles : évite de les re-télécharger à chaque rebuild.
      - models-cache:/models

    command: ["/app/run_scheduler.sh"]

    # Garde-fou mémoire. Les 5 modèles sont chargés SÉQUENTIELLEMENT avec
    # unload + gc.collect() entre chaque passe, donc le pic ne dépend que du
    # plus gros (TimesFM 200M). Mesuré large : ~3 Go avec le runtime torch.
    deploy:
      resources:
        limits:
          memory: 3800M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  models-cache:
