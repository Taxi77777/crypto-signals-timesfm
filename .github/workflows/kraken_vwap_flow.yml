name: Bot VWAP ORDER FLOW (footprint 1 min, perpetuels Kraken Pro)

# Strategie de la video "Comment confirmer une
# entree sur la VWAP" : prix sur la VWAP + vendeurs absorbes + big trade respecte
# + acheteurs de retour. Le bot lit CHAQUE trade Kraken en direct (WebSocket).
# Chaque job dure ~5 h 20 puis le workflow se relance lui-meme ; le cron horaire
# n'est qu'un filet de securite.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'paper (fictif) ou live (REEL). Vide = valeur de la variable KRAKEN_MODE'
        type: string
        default: ''
      minutes:
        description: 'Duree de ce job en minutes (320 = fonctionnement continu)'
        type: string
        default: ''

concurrency:
  # un seul bot a la fois ; un lancement en attente patiente au lieu de TUER le job
  # en cours (sinon position ouverte + etat perime)
  group: kraken-vwap
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Dependances
        run: pip install requests websocket-client

      - name: Bot VWAP ORDER FLOW
        env:
          KRAKEN_KEY:         ${{ secrets.KRAKEN_KEY || secrets.CLE_PUBLIQUE }}
          KRAKEN_SECRET:      ${{ secrets.KRAKEN_SECRET || secrets.CLE_PRIVEE }}
          # "paper" = fictif. REEL : variable KRAKEN_MODE = live
          KRAKEN_MODE:        ${{ inputs.mode || vars.KRAKEN_MODE || 'paper' }}
          VWAP_SYMBOLS:       ${{ vars.VWAP_SYMBOLS }}
          STOP_MODE:          ${{ vars.STOP_MODE }}
          RR:                 ${{ vars.RR }}
          VWAP_TOP_N:         ${{ vars.VWAP_TOP_N }}
          VWAP_MIN_VOL:       ${{ vars.VWAP_MIN_VOL }}
          TRAIL_R:            ${{ vars.TRAIL_R }}
          LEARN:              ${{ vars.LEARN }}
          LEVERAGE:           ${{ vars.LEVERAGE }}
          SIZING:             ${{ vars.SIZING }}
          RISK_PCT:           ${{ vars.RISK_PCT }}
          MAX_OPEN:           ${{ vars.MAX_OPEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES:       ${{ inputs.minutes || '320' }}
          PYTHONUNBUFFERED:   '1'
        run: |
          # sauvegarde de l'etat (sans capital ni P&L) toutes les 15 min pendant le job :
          # on peut suivre ce que le bot voit sans attendre la fin des 5 h 20
          save() {
            F=kraken_vwap_state.json
            [ -f "$F" ] || return 0
            cp "$F" /tmp/state.json
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              cp /tmp/state.json "$F"
              git add -f "$F"
              git diff --cached --quiet && return 0
              git commit -qm "chore: etat bot vwap [skip ci]"
              git push -q origin HEAD:main && return 0
              sleep $((RANDOM % 5 + 2))
            done
          }
          python kraken_vwap_flow.py &
          PID=$!
          ( while kill -0 $PID 2>/dev/null; do sleep 900; kill -0 $PID 2>/dev/null && save || true; done ) &
          wait $PID

      - name: Sauvegarde de l'etat (positions)
        if: always()
        run: |
          F=kraken_vwap_state.json
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/state.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/state.json "$F"
            git add -f "$F"
            git diff --cached --quiet && exit 0
            git commit -qm "chore: etat bot vwap [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "::warning::etat non sauvegarde"

  relance:
    needs: bot
    # relance seulement si le job s'est bien termine (pas de boucle de relances si le
    # bot plante au demarrage) ; le cron horaire reste le filet de securite
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relance du bot (fonctionnement 24h/24)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kraken_vwap_flow.yml --repo "${{ github.repository }}" --ref main
