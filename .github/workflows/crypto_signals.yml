name: Breaker FVG Sniper — PERP Kraken Pro (RETEST -> Telegram)

# SCAN EN CONTINU : chaque job tourne ~5 h 40 et rescanne toutes les 3 min,
# puis le workflow se relance lui-meme (workflow_dispatch).
# Le cron (toutes les heures) sert de filet de securite si la chaine s'arrete.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer un message test sur Telegram'
        type: boolean
        default: false

concurrency:
  group: breaker-fvg-sniper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]     # 4 lots de ~30 cryptos en parallele (IP differentes)
    permissions:
      contents: write
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependances
        run: pip install requests

      - name: Scan en continu Breaker FVG Sniper (M15/M30, perpetuels Kraken Pro)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BFS_TFS: "M15,M30"
          BFS_MIN_SCORE: "40"
          BFS_TOP_N: "120"
          BFS_MARKET: "perp"
          BFS_MIN_QUOTE_VOL: "50000"
          BFS_SHARDS: "4"
          BFS_SHARD: ${{ matrix.shard }}
          BFS_QUOTE: "USD"
          BFS_LOOP_MINUTES: "330"
          BFS_INTERVAL: "180"
          BFS_TEST: ${{ github.event.inputs.test }}
          PYTHONUNBUFFERED: "1"
        run: python breaker_fvg_sniper.py

      # Memorise les signaux deja envoyes (pas de doublon sur Telegram)
      - name: Sauvegarde de l'etat
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          F=bfs_state_${{ matrix.shard }}.json
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/state.json
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/state.json "$F"
            git add -f "$F"
            git diff --cached --quiet && exit 0
            git commit -qm "chore: bfs state ${{ matrix.shard }} [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "::warning::etat non sauvegarde"

  relance:
    needs: scan
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relance du scan continu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crypto_signals.yml --repo "${{ github.repository }}" --ref main
