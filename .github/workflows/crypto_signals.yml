name: Institutional Hunter Pro v5.0 — 24/7 Cloud (75 Cryptos, 5m)

on:
  schedule:
    # Analyse automatique toutes les 5 minutes 24h/24, 7j/7 dans le Cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:            # Bouton de lancement manuel

concurrency:
  group: crypto-signals-live
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancement de l'analyse 75 Cryptos + TimesFM 2.5 (5 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python bot_once.py

      - name: Commit et Push des logs
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add bot.log signals_log.csv trades_log.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto log update [skip ci]" || true
            git push origin main || true
          fi
