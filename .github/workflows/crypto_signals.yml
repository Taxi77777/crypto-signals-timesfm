name: Institutional Hunter Pro v5.2 — 24/7 Cloud

# ══════════════════════════════════════════════════════════════════
#  CADENCE
#
#  Le `schedule` de GitHub reste ici en FILET DE SECURITE seulement.
#  Il est etrangle (runs observes espaces de 1 a 3 h) et ne peut pas
#  porter la cadence a lui seul.
#
#  La vraie cadence vient du Worker Cloudflare, qui appelle
#  `workflow_dispatch` toutes les 5 minutes. Ce type d'evenement
#  n'est PAS soumis a l'etranglement des crons : il part tout de
#  suite. Voir cloudflare/worker.js.
# ══════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # Serialise les runs : deux runs en parallele se marcheraient dessus
  # sur state.json et le push git. Un run en attente maximum, les
  # declenchements supplementaires sont ignores — c'est voulu.
  group: crypto-signals-live
  cancel-in-progress: false

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 12

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le modele TimesFM 2.5 fait ~200M de parametres. Sans ce cache il
      # etait retelecharge a chaque run (1 a 2 minutes), et tout echec
      # reseau desactivait silencieusement l'IA.
      - name: Cache du modele Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-2p5-200m-v1
          restore-keys: |
            hf-timesfm-

      - name: Verification des variables d'environnement
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["MEXC_API_KEY", "MEXC_SECRET_KEY",
                      "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          missing = [k for k in required if not os.environ.get(k, "").strip()]
          for k in required:
              v = os.environ.get(k, "")
              status = f"OK ({len(v)} caracteres)" if v.strip() else "MANQUANT"
              print(f"  {k:22s} : {status}")
          if missing:
              print("\nSecrets manquants : " + ", ".join(missing))
              print("A definir dans Settings > Secrets and variables > Actions")
              sys.exit(1)
          print("\nTous les secrets sont presents.")
          PY

      - name: Lancement de l'analyse (75 cryptos + TimesFM 2.5)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
          # Relais Cloudflare pour Binance / Kraken / OKX / Bybit / Bitget.
          # Optionnels : sans eux le bot appelle les exchanges en direct.
          EXCHANGE_PROXY_URL: ${{ secrets.EXCHANGE_PROXY_URL }}
          EXCHANGE_PROXY_TOKEN: ${{ secrets.EXCHANGE_PROXY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python bot_once.py

      # ══════════════════════════════════════════════════════════════
      #  state.json porte les positions suivies, le cooldown et le PnL
      #  journalier. Sans ce commit, chaque run repart de zero.
      #
      #  CHANGEMENT v5.2 : bot.log n'est PLUS commite.
      #  Il pesait 1,4 Mo et etait reecrit a chaque run. A raison d'un
      #  run toutes les 5 minutes, le depot grossissait d'environ
      #  400 Mo par jour, et chaque `git pull --rebase` devenait plus
      #  lent que le precedent. Le log reste disponible en artifact,
      #  ce qui est sa place.
      # ══════════════════════════════════════════════════════════════
      - name: Commit de l'etat et des logs
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # `git add a b c` echoue ENTIEREMENT si un seul chemin manque.
          # On ajoute donc fichier par fichier.
          for f in state.json paper_state.json paper_trades.csv signals_log.csv trades_log.csv; do
            if [ -f "$f" ]; then
              git add -f "$f" && echo "  indexe : $f"
            else
              echo "  absent : $f (ignore)"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto state/log update [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin main || true
          fi

      - name: Upload des logs en artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ihp-logs-${{ github.run_number }}
          path: |
            bot.log
            state.json
            paper_state.json
            paper_trades.csv
            signals_log.csv
            trades_log.csv
          if-no-files-found: ignore
          retention-days: 7
