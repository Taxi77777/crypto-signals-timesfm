name: Crypto Signals Bot (50 Cryptos) — Auto 15m

on:
  schedule:
    # Toutes les 15 minutes, aligné sur la clôture des bougies 15m (timeframe de trading).
    # GitHub Actions peut retarder les runs planifiés de quelques minutes en heure de pointe.
    - cron: '*/15 * * * *'
  workflow_dispatch:            # Bouton manuel toujours disponible

# Empêche deux runs de trader en parallèle (un run dure 7-9 min, le cron est à 15 min :
# en cas de retard GitHub, deux runs pourraient se chevaucher et ouvrir des doublons).
# cancel-in-progress: false → on ne tue JAMAIS un run qui a peut-être déjà ouvert une position.
concurrency:
  group: crypto-signals-live
  cancel-in-progress: false

jobs:
  send-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Installation des modeles IA additionnels
        run: |
          pip install uni2ts
          pip install scikit-learn deprecated
          pip install granite-tsfm --no-deps
          pip install git+https://github.com/time-series-foundation-models/lag-llama.git
          pip install "transformers<4.50"  # compat torch 2.4 (uni2ts) - evite l'erreur DTensor

      - name: Vérification des contrats MEXC
        run: python verify_mexc_futures.py

      - name: Lancement de l'analyse Crypto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
          USE_TIMESFM: 'true'
          # NE PAS passer à 15m : run_once.py calcule le volume 24h avec tail(288),
          # ce qui suppose des bougies 5m. La stratégie Sniper télécharge de toute
          # façon ses propres bougies 15m/30m indépendamment de ce réglage.
          DATA_INTERVAL: '5m'
          SIGNAL_FREQUENCY_HOURS: '1'
          LOG_LEVEL: 'INFO'
        run: python run_once.py

      - name: Commit et Push de signals.json
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add signals.json track_record.json pending_predictions.json pending_pullbacks.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Aucune modification à commit."
              break
            fi
            git commit -m "chore: update crypto signals.json [skip ci]" || true
            if git push origin main; then
              echo "✅ Push réussi avec succès à la tentative $i !"
              break
            fi
            echo "⚠️ Push tentative $i échouée, nouvel essai dans 3s..."
            sleep 3
          done

      - name: Sauvegarde des logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-logs-${{ github.run_number }}
          path: logs/signals.log
          retention-days: 7
