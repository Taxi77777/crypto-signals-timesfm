name: Bot Pro - signaux intraday (Telegram)

# Stocks in Play + momentum intraday (zone de bruit + VWAP) + couche Bloomberg (briefing, regime).
# SIGNAUX UNIQUEMENT : aucun ordre n'est envoye.
# Actif tous les jours de 6 h a 21 h 15 UTC (actions et forex en semaine, crypto 7 j/7).
on:
  schedule:
    # GitHub saute souvent des crons : un tick toutes les 15 min (un seul job en attente a la
    # fois) + le job se relance lui-meme quand il atteint sa duree maximale
    - cron: '*/15 6-20 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Duree de ce job en minutes (320 max)'
        type: string
        default: ''

concurrency:
  group: bot-pro
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 340
    outputs:
      relance: ${{ steps.scan.outputs.relance }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Dependances
        run: pip install "requests>=2.31,<3" tzdata

      # OpenBB (actualites, resultats, calendrier eco) : facultatif. S'il ne s'installe pas,
      # le bot tourne quand meme (les signaux ne doivent jamais dependre de lui).
      - name: OpenBB (facultatif)
        continue-on-error: true
        timeout-minutes: 12
        run: pip install --prefer-binary openbb-core openbb-yfinance openbb-nasdaq openbb-news openbb-equity openbb-economy

      - name: Bot Pro
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SIP_STOCKS:         ${{ vars.SIP_STOCKS }}
          MOM_STOCKS:         ${{ vars.MOM_STOCKS }}
          MOM_FX:             ${{ vars.MOM_FX }}
          MOM_CRYPTO:         ${{ vars.MOM_CRYPTO }}
          MIN_SCORE:          ${{ vars.MIN_SCORE }}
          MAX_SAME:           ${{ vars.MAX_SAME }}
          CAPITAL:            ${{ vars.CAPITAL }}
          RISK_PCT:           ${{ vars.RISK_PCT }}
          LOOP_MINUTES:       ${{ inputs.minutes || '320' }}
          STATE_DIR:          /tmp/etat_bot
          PYTHONUNBUFFERED:   '1'
        run: |
          save() {
            exec 9>/tmp/bot.lock
            flock 9
            ls /tmp/etat_bot/*.json >/dev/null 2>&1 || { flock -u 9; return 0; }
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            for i in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              cp /tmp/etat_bot/bot_pro_state.json .
              git add -f bot_pro_state.json
              git diff --cached --quiet && break
              git commit -qm "chore: etat bot pro [skip ci]"
              git push -q origin HEAD:main && break
              sleep $((RANDOM % 5 + 2))
            done
            flock -u 9
          }
          python bot_pro.py &
          PID=$!
          trap 'kill -TERM $PID 2>/dev/null; wait $PID' INT TERM
          ( while kill -0 $PID 2>/dev/null; do sleep 600; kill -0 $PID 2>/dev/null && save || true; done ) &
          SAVER=$!
          RC=0
          wait $PID || RC=$?
          kill $SAVER 2>/dev/null || true
          if [ -f /tmp/etat_bot/relance ]; then echo "relance=1" >> "$GITHUB_OUTPUT"; fi
          exit $RC

      - name: Sauvegarde de l'etat
        if: always()
        run: |
          exec 9>/tmp/bot.lock
          flock -w 120 9 || true
          ls /tmp/etat_bot/*.json >/dev/null 2>&1 || exit 0
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/etat_bot/bot_pro_state.json . || continue
            git add -f bot_pro_state.json || continue
            git diff --cached --quiet && exit 0
            git commit -qm "chore: etat bot pro [skip ci]" || continue
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "::warning::etat du bot non sauvegarde"

  relance:
    needs: bot
    # le job a atteint sa duree maximale en pleine journee : on en relance un tout de suite
    if: ${{ needs.bot.outputs.relance == '1' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relance du bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot_pro.yml --repo "${{ github.repository }}" --ref main
