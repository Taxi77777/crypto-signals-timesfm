name: Backtest PRIX + VOLUME (historique 4H)

# Lancement MANUEL uniquement — n'interfere jamais avec le bot en production.
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache du modele Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-timesfm-2p5-200m-v1
          restore-keys: |
            hf-timesfm-

      # Aucune cle MEXC necessaire : le backtest n'utilise que les
      # bougies publiques. Aucun ordre, aucune lecture de compte.
      - name: Lancement du backtest
        env:
          PYTHONUNBUFFERED: "1"
        run: python backtest_signals.py

      - name: Upload des resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: backtest_results.csv
          if-no-files-found: ignore
          retention-days: 30
