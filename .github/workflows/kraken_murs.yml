name: Bot MURS & BULLES (carnet d'ordres reel, perpetuels Kraken Pro)

# Remplace l'ancien bot "PIEGE PDH/PDL -> MA50".
# Le bot tourne EN CONTINU : chaque job dure ~5 h 20, lit le carnet d'ordres
# Kraken toutes les 60 s, puis le workflow se relance lui-meme. Le cron horaire
# n'est qu'un filet de securite (les crons GitHub sont souvent retardes).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'paper (fictif) ou live (REEL). Vide = valeur de la variable KRAKEN_MODE'
        type: string
        default: ''
      minutes:
        description: 'Duree de ce job en minutes (320 = fonctionnement continu)'
        type: string
        default: ''

concurrency:
  # un seul bot a la fois ; un lancement en attente patiente au lieu de TUER
  # le job en cours (sinon position ouverte + etat perime)
  group: kraken-murs
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependances
        run: pip install requests

      - name: Bot MURS & BULLES
        env:
          KRAKEN_KEY:         ${{ secrets.KRAKEN_KEY || secrets.CLE_PUBLIQUE }}
          KRAKEN_SECRET:      ${{ secrets.KRAKEN_SECRET || secrets.CLE_PRIVEE }}
          # "paper" = fictif. REEL : variable KRAKEN_MODE = live
          KRAKEN_MODE:        ${{ inputs.mode || vars.KRAKEN_MODE || 'paper' }}
          KRAKEN_SYMBOLS:     ${{ vars.KRAKEN_SYMBOLS }}
          KRAKEN_TF:          ${{ vars.KRAKEN_TF_MURS }}
          LEVERAGE:           ${{ vars.LEVERAGE }}
          SIZING:             ${{ vars.SIZING }}
          RISK_PCT:           ${{ vars.RISK_PCT }}
          MAX_OPEN:           ${{ vars.MAX_OPEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES:       ${{ inputs.minutes || '320' }}
          INTERVAL:           '60'
          PYTHONUNBUFFERED:   '1'
        run: python kraken_murs.py

      - name: Sauvegarde de l'etat (positions / murs)
        if: always()
        run: |
          F=kraken_murs_state.json
          [ -f "$F" ] || exit 0
          cp "$F" /tmp/state.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/state.json "$F"
            git add -f "$F"
            git diff --cached --quiet && exit 0
            git commit -qm "chore: etat bot murs [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "::warning::etat non sauvegarde"

  relance:
    needs: bot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relance du bot (fonctionnement 24h/24)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kraken_murs.yml --repo "${{ github.repository }}" --ref main
