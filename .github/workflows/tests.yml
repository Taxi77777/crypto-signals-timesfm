name: Tests

on:
  workflow_dispatch:      # a la demande : le Bot Pro est desactive, ces tests prenaient des places de calcul

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes bot_pro.py tests
      - run: python -m pytest -q
